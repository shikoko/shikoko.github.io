<!DOCTYPE html>
<!-- Social preview card: the source of assets/social-preview.png on the site.
     Rendered at 1200x630 for the page's og:image, and at 1280x640 for
     the repository's social preview on GitHub. tools/build.cjs renders both.
     Keep the title and the roles in step with index.html. -->
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<title>Social preview card</title>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; }
  body {
    display: grid;
    grid-template-columns: 1fr 420px;
    gap: 72px;
    padding: 84px 88px 76px;
    background: #f8f6f0;
    color: #3b3a36;
    font-family: "Google Sans", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: "JetBrains Mono", monospace; }
  .left { display: flex; flex-direction: column; }
  .left::before { content: ""; width: 52px; height: 4px; margin-bottom: 34px; background: #2b4a6f; }
  .name { font-size: 96px; font-weight: 500; line-height: 1; letter-spacing: -.035em; color: #1d1d1b; }
  .title { margin-top: 18px; font-size: 38px; letter-spacing: -.01em; color: #2b4a6f; }
  .platforms { margin-top: 14px; font-size: 24px; color: #69655c; }
  .site { margin-top: auto; font-size: 19px; letter-spacing: .06em; color: #69655c; }

  .right { padding-left: 44px; border-left: 1.5px solid #e2ddd1; }
  .label { margin-top: 8px; font-size: 16px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: #2b4a6f; }
  .jobs { list-style: none; margin-top: 34px; }
  .jobs li + li { margin-top: 26px; }
  .org { font-size: 30px; font-weight: 600; line-height: 1.1; letter-spacing: -.02em; color: #1d1d1b; }
  .role { margin-top: 4px; display: flex; justify-content: space-between; gap: 16px; font-size: 19px; }
  .role .years { font-size: 17px; color: #69655c; white-space: nowrap; align-self: center; }
  .more { font-size: 19px; color: #69655c; }
</style>
</head>
<body>
  <div class="left">
    <h1 class="name">Bogdan<br>Roatis</h1>
    <p class="title">Senior Mobile Engineer</p>
    <p class="platforms">Android &amp; iOS · London, UK</p>
    <p class="site mono">shikoko.github.io</p>
  </div>
  <div class="right">
    <p class="label mono">Experience</p>
    <ol class="jobs">
      <li><p class="org">STEM</p><p class="role"><span>Mobile Lead · 3 roles</span><span class="years">2022 – 2026</span></p></li>
      <li><p class="org">SKOOT</p><p class="role"><span>Mobile Team Lead</span><span class="years">2021 – 2022</span></p></li>
      <li><p class="org">Peak</p><p class="role"><span>Senior Android Developer</span><span class="years">2020</span></p></li>
      <li><p class="more">4 earlier Android roles since 2013</p></li>
    </ol>
  </div>
</body>
</html>
