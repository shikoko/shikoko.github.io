<!DOCTYPE html>
<!-- Social preview card for the home page: the source of assets/home-preview.png
     on the site, rendered at 1200x630 by tools/build.cjs for the home page's
     og:image. The CV keeps its own card, tools/social-card.html.
     The left side matches the CV's card; keep the name and title in step with it.
     The right side is an abstract arrangement of shapes in the five accent
     colours of the projects: a rounded square like an app icon, a disc, a half
     circle, a pill and a squiggle like Signature's mark. -->
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<title>Home page preview card</title>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; }
  body {
    position: relative;
    background: #f8f6f0;
    color: #3b3a36;
    font-family: "Google Sans", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: "JetBrains Mono", monospace; }

  /* The same left side as the CV's card */
  .text { position: absolute; z-index: 1; left: 88px; top: 84px; bottom: 76px; display: flex; flex-direction: column; }
  .text::before { content: ""; width: 52px; height: 4px; margin-bottom: 34px; background: #2b4a6f; }
  .name { font-size: 96px; font-weight: 500; line-height: 1; letter-spacing: -.035em; color: #1d1d1b; }
  .title { margin-top: 18px; font-size: 38px; letter-spacing: -.01em; color: #2b4a6f; }
  .platforms { margin-top: 14px; font-size: 24px; color: #69655c; }
  .site { margin-top: auto; font-size: 19px; letter-spacing: .06em; color: #69655c; }

  /* The shapes, drawn on a 1200x630 canvas to the right of the words */
  .shapes { position: absolute; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
  <div class="text">
    <h1 class="name">Bogdan<br>Roatis</h1>
    <p class="title">Senior Mobile Engineer</p>
    <p class="platforms">Android &amp; iOS · London, UK</p>
    <p class="site mono">shikoko.github.io</p>
  </div>
  <svg class="shapes" viewBox="0 0 1200 630" preserveAspectRatio="xMaxYMid meet" aria-hidden="true">
    <rect x="770" y="70" width="230" height="230" rx="54" fill="#1597d6"/>
    <circle cx="1010" cy="380" r="140" fill="#ec3f8a" style="mix-blend-mode: multiply"/>
    <path d="M 640 520 A 120 120 0 0 1 880 520 Z" fill="#eb9a10"/>
    <rect x="860" y="250" width="250" height="78" rx="39" fill="#1fb877" transform="rotate(-24 985 289)" style="mix-blend-mode: multiply"/>
    <path d="M 640 210 c 30 -60 60 60 90 0 s 60 60 90 0 s 60 60 90 0" fill="none" stroke="#7b57f0" stroke-width="18" stroke-linecap="round"/>
    <circle cx="1120" cy="110" r="26" fill="#1d1d1b"/>
  </svg>
</body>
</html>
