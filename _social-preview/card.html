<!DOCTYPE html>
<!-- Social preview card: the source of assets/social-preview.png.
     Rendered at 1200x630 for the page's og:image, and at 1280x640 for
     the repository's social preview on GitHub. CLAUDE.md has the command.
     Keep the headline and the roles in step with index.html. -->
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;750&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; }
  body {
    position: relative;
    display: grid;
    grid-template-columns: 1fr 430px;
    gap: 64px;
    padding: 80px 88px 72px;
    background: #14171a;
    color: #bcc1c9;
    font-family: "Inter", sans-serif;
    font-feature-settings: "cv11", "ss01";
    -webkit-font-smoothing: antialiased;
  }
  /* Dots fading in from the right edge */
  body::after {
    content: "";
    position: absolute;
    right: -40px;
    top: -40px;
    width: 560px;
    height: calc(100% + 80px);
    background-image: radial-gradient(rgba(61, 220, 132, .2) 2.5px, transparent 3px);
    background-size: 34px 34px;
    -webkit-mask-image: linear-gradient(to left, #000 10%, transparent 85%);
    mask-image: linear-gradient(to left, #000 10%, transparent 85%);
  }
  .left, .right { position: relative; z-index: 1; }
  .left { display: flex; flex-direction: column; }
  .mono { font-family: "JetBrains Mono", monospace; }
  .icon { width: 1em; height: 1em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .eyebrow { display: inline-flex; align-items: center; gap: 14px; margin-bottom: 28px; font-family: "JetBrains Mono", monospace; font-size: 20px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: #3ddc84; }
  .eyebrow::before { content: ""; width: 40px; height: 3px; border-radius: 2px; background: currentColor; }
  .name { font-size: 92px; font-weight: 750; line-height: 1.02; letter-spacing: -.03em; color: #e9ebee; }
  .headline { margin-top: 22px; font-size: 34px; font-weight: 500; line-height: 1.3; }
  .headline .platforms { color: #3ddc84; }
  .meta { margin-top: auto; display: flex; flex-direction: column; gap: 12px; font-size: 22px; }
  .meta span { display: inline-flex; align-items: center; gap: 12px; }
  .meta .icon { color: #3ddc84; }

  .title { display: flex; align-items: center; gap: 16px; margin: 12px 0 30px; font-size: 17px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #8d939c; }
  .title::after { content: ""; flex: 1; height: 1.5px; background: #262a2f; }
  .jobs { position: relative; list-style: none; }
  .jobs::before { content: ""; position: absolute; left: 6px; top: 14px; bottom: 14px; width: 2px; background: #262a2f; }
  .jobs li { position: relative; padding-left: 38px; }
  .jobs li + li { margin-top: 26px; }
  .jobs li::before { content: ""; position: absolute; left: 0; top: 9px; width: 10px; height: 10px; border-radius: 50%; background: #14171a; border: 2.5px solid #3ddc84; }
  .jobs li:first-child::before { background: #3ddc84; }
  .role { font-size: 25px; font-weight: 650; letter-spacing: -.01em; color: #e9ebee; }
  .org { margin-top: 3px; display: flex; justify-content: space-between; font-size: 20px; }
  .org b { font-weight: 600; color: #3ddc84; }
  .org .mono { font-size: 17px; color: #8d939c; }
  .jobs li.more .role { font-size: 21px; font-weight: 500; color: #8d939c; }
</style>
</head>
<body>
  <div class="left">
    <p class="eyebrow">Curriculum vitae</p>
    <h1 class="name">Bogdan<br>Roatis</h1>
    <p class="headline">Lead Mobile Engineer<br><span class="platforms">Android &amp; iOS</span></p>
    <div class="meta">
      <span><svg class="icon" viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>London, UK</span>
      <span><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>shikoko.github.io</span>
    </div>
  </div>
  <div class="right">
    <p class="title mono">Experience</p>
    <ol class="jobs">
      <li><p class="role">Mobile Lead</p><p class="org"><span><b>STEM</b> · 3 roles</span><span class="mono">2022 – 2026</span></p></li>
      <li><p class="role">Mobile Team Lead</p><p class="org"><b>SKOOT</b><span class="mono">2021 – 2022</span></p></li>
      <li><p class="role">Senior Android Developer</p><p class="org"><b>Peak</b><span class="mono">2020</span></p></li>
      <li class="more"><p class="role">4 earlier Android roles since 2013</p></li>
    </ol>
  </div>
</body>
</html>
