name: Deploy

# Builds the site with `npm run build` (the page, plus the PDF and the social
# preview image rendered from it with Chromium) for every pull request into
# main and every push to main, and publishes the pushes with GitHub Pages.
# The build fails if the PDF is longer than three pages, so a pull request
# that pushes it to four can't be merged unnoticed.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The runner image already has the system libraries Chromium needs.
      # --with-deps would only add fallback fonts the build never draws
      # with (the page and the card load their own), and fetching them from
      # the Ubuntu mirror once took long enough to cancel the job.
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Build the site
        run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
